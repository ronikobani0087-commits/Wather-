
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Create the Android project
        run: |
          set -euo pipefail
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.taqsi.weather",
            "appName": "طقسي",
            "webDir": "www",
            "backgroundColor": "#0b1530"
          }
          EOF
          npx cap add android

          RES=android/app/src/main/res

          # solid splash screen instead of the default Capacitor logo
          find "$RES" -name 'splash*.png' -delete
          mkdir -p "$RES/drawable"
          cat > "$RES/drawable/splash.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#0B1530"/>
          </shape>
          EOF

          # app icon: sun behind a cloud on a blue sky
          cat > "$RES/drawable/weather_icon_bg.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:angle="270" android:startColor="#62B0F0" android:endColor="#2B6FD0"/>
          </shape>
          EOF
          cat > "$RES/drawable/weather_icon_fg.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFD45A" android:pathData="M31,40a13,13 0 1,0 26,0a13,13 0 1,0 -26,0"/>
              <path android:fillColor="#F4F7FB" android:pathData="M37,68a9,9 0 1,0 18,0a9,9 0 1,0 -18,0"/>
              <path android:fillColor="#F4F7FB" android:pathData="M45,60a13,13 0 1,0 26,0a13,13 0 1,0 -26,0"/>
              <path android:fillColor="#F4F7FB" android:pathData="M60,67a10,10 0 1,0 20,0a10,10 0 1,0 -20,0"/>
              <path android:fillColor="#F4F7FB" android:pathData="M46,68h24v9h-24z"/>
          </vector>
          EOF
          mkdir -p "$RES/mipmap-anydpi-v26"
          for n in ic_launcher ic_launcher_round; do
            cat > "$RES/mipmap-anydpi-v26/$n.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/weather_icon_bg"/>
              <foreground android:drawable="@drawable/weather_icon_fg"/>
          </adaptive-icon>
          EOF
          done

          # dark status bar and navigation bar to match the app
          sed -i 's#<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">#&\n        <item name="android:statusBarColor">\#0B1530</item>\n        <item name="android:navigationBarColor">\#0B1530</item>#' "$RES/values/styles.xml"

          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Taqsi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Taqsi-apk
          path: Taqsi.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: طقسي ${{ github.run_number }}
          files: Taqsi.apk
